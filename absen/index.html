<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absen Karyawan</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="container auth-container">
    <div class="auth-card">
      <!-- Login Form -->
      <div id="login-panel">
        <div class="auth-header">
          <h1>👋 Selamat Datang</h1>
          <p>Login untuk mengabsen</p>
        </div>
        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" placeholder="email@contoh.com" required>
          </div>
          <div class="form-group">
            <label for="login-pass">Password</label>
            <input type="password" id="login-pass" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
        <div id="login-msg" class="msg"></div>
        <p class="auth-switch">
          Belum punya akun?
          <a href="#" id="show-register">Daftar di sini</a>
        </p>
      </div>

      <!-- Register Form (hidden by default) -->
      <div id="register-panel" class="hidden">
        <div class="auth-header">
          <h1>📝 Daftar Akun</h1>
          <p>Buat akun karyawan baru</p>
        </div>
        <form id="register-form">
          <div class="form-group">
            <label for="reg-name">Nama Lengkap</label>
            <input type="text" id="reg-name" placeholder="Budi Santoso" required>
          </div>
          <div class="form-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" placeholder="email@contoh.com" required>
          </div>
          <div class="form-group">
            <label for="reg-pass">Password</label>
            <input type="password" id="reg-pass" placeholder="minimal 6 karakter" minlength="6" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Daftar</button>
        </form>
        <div id="register-msg" class="msg"></div>
        <p class="auth-switch">
          Sudah punya akun?
          <a href="#" id="show-login">Login di sini</a>
        </p>
      </div>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
  <script>
    // Handle panel toggle
    document.getElementById('show-register').addEventListener('click', e => {
      e.preventDefault();
      document.getElementById('login-panel').classList.add('hidden');
      document.getElementById('register-panel').classList.remove('hidden');
    });
    document.getElementById('show-login').addEventListener('click', e => {
      e.preventDefault();
      document.getElementById('register-panel').classList.add('hidden');
      document.getElementById('login-panel').classList.remove('hidden');
    });
  </script>

</body>
</html>
