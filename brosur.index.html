<!DOCTYPE html>
<html>
<head>
  <title>Chat PDF</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 20px; }
    #chat { height: 400px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
    .msg { margin: 10px 0; }
    .user { color: blue; }
    .bot { color: green; }
  </style>
</head>
<body>
  <h2>📄 Chat dengan Brosur PDF</h2>
  <div id="chat"></div>
  <input id="input" placeholder="Ketik pertanyaan..." style="width:80%">
  <button onclick="send()">Kirim</button>

  <script>
    async function send() {
      const input = document.getElementById("input");
      const msg = input.value;
      if (!msg) return;
      const chat = document.getElementById("chat");
      chat.innerHTML += `<div class='msg user'>👤 ${msg}</div>`;
      input.value = "";

      const res = await fetch("https://pdfchat-production.up.railway.app/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg })
      });

      const data = await res.json();
      chat.innerHTML += `<div class='msg bot'>🤖 ${data.answer}</div>`;
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
