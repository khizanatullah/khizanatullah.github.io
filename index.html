<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Katalog Produk KHIZ</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #e0f7ff;
      color: #333;
      margin: 0;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 { color: #0066cc; }
    #search {
      width: 90%;
      max-width: 500px;
      padding: 10px 15px;
      border: 1px solid #0066cc;
      border-radius: 5px;
      margin: 10px auto;
      display: block;
    }
    #products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .product-card {
      background: white;
      border: 1px solid #0099ff;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.1);
    }
    .product-card h3 {
      font-size: 16px;
      margin: 0 0 5px;
      color: #0055aa;
    }
    .product-card p { font-size: 14px; margin: 3px 0; }
    .no-result {
      text-align: center;
      padding: 30px;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <h1>🛒 Katalog Produk KHIZ</h1>
    <input type="text" id="search" placeholder="🔍 Cari nama barang..." />
  </header>
  <div id="products"></div>

  <script>
    let products = [];
    const container = document.getElementById("products");
    const searchInput = document.getElementById("search");

    function formatRupiah(num) {
      return `Rp ${num.toLocaleString('id-ID', { maximumFractionDigits: 0 })}`;
    }

    function render(list) {
      if (!list.length) {
        container.innerHTML = '<div class="no-result">Tidak ditemukan produk.</div>';
        return;
      }
      container.innerHTML = list.map(p => `
        <div class="product-card">
          <h3>${p["Nama Barang"]}</h3>
          <p><strong>Harga:</strong> ${formatRupiah(p["Hrg. Jual"])}</p>
          <p><strong>Stok:</strong> ${p["Stok"] ?? '-'}</p>
        </div>
      `).join('');
    }

    function filter() {
      const keyword = (searchInput.value || '').toLowerCase().trim();
      if (!keyword) return render(products);
      render(products.filter(p =>
        (p["Nama Barang"] || '').toLowerCase().includes(keyword)
      ));
    }

    searchInput.addEventListener("input", filter);

    fetch('./products.json')
      .then(res => {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(data => {
        console.log("✅ Loaded:", data.length, "produk");
        products = data;
        render(products);
      })
      .catch(err => {
        container.innerHTML = `<div class="no-result" style="color:red">⚠️ Gagal memuat data produk: ${err.message}</div>`;
      });
  </script>
</body>
</html>
