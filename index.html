<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Produk Toko Bangunan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .search-bar {
            max-width: 800px;
            margin: 0 auto 20px auto;
            display: flex;
            gap: 10px;
        }
        .search-bar input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 6px 0 0 6px;
            font-size: 14px;
            outline: none;
        }
        .search-bar button {
            padding: 12px 20px;
            background: #4a90d9;
            color: white;
            border: none;
            border-radius: 0 6px 6px 0;
            cursor: pointer;
            font-size: 14px;
        }
        .search-bar button:hover {
            background: #357abd;
        }
        .products-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #f8f9fa;
            padding: 14px 12px;
            text-align: left;
            font-weight: 600;
            color: #555;
            border-bottom: 2px solid #e9ecef;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        tr:hover {
            background: #f8f9fa;
        }
        .numeric {
            text-align: right;
        }
        .stock-negative {
            color: #e74c3c;
            font-weight: 500;
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 20px;
            background: white;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .pagination button {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
        }
        .pagination button:hover {
            background: #f0f0f0;
        }
        .pagination button.active {
            background: #4a90d9;
            color: white;
            border-color: #4a90d9;
        }
        .no-results {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Daftar Produk Toko Bangunan</h1>
        
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Cari nama barang...">
            <button onclick="searchProducts()">Cari</button>
        </div>
        
        <div class="products-container">
            <table id="productsTable">
                <thead>
                    <tr>
                        <th style="width: 40%">Nama Barang</th>
                        <th style="width: 120px">Satuan</th>
                        <th style="width: 150px" class="numeric">Harga Jual</th>
                        <th style="width: 100px" class="numeric">Stok</th>
                    </tr>
                </thead>
                <tbody id="productsBody">
                </tbody>
            </table>
        </div>
        
        <div class="pagination" id="pagination">
        </div>
    </div>

    <script>
        let products = [];
        let currentPage = 1;
        const itemsPerPage = 10;
        let filteredProducts = [];

        fetch('produk.json')
            .then(response => response.json())
            .then(data => {
                products = data;
                filteredProducts = products;
                renderProducts();
                renderPagination();
            })
            .catch(err => console.error('Error loading data:', err));

        function renderProducts() {
            const tbody = document.getElementById('productsBody');
            const startIdx = (currentPage - 1) * itemsPerPage;
            const endIdx = startIdx + itemsPerPage;
            const pageProducts = filteredProducts.slice(startIdx, endIdx);

            if (pageProducts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="no-results">Tidak ada data yang ditemukan</td></tr>';
                return;
            }

            tbody.innerHTML = pageProducts.map(p => {
                const stockNum = parseInt(p.stok.replace(/,/g, ''));
                const stockClass = stockNum < 0 ? 'stock-negative' : '';
                return '<tr><td style="font-weight: 500;">' + escapeHtml(p.nama) + '</td><td>' + escapeHtml(p.satuan) + '</td><td class="numeric">' + formatRupiah(p.harga_jual) + '</td><td class="' + stockClass + '">' + escapeHtml(p.stok) + '</td></tr>';
            }).join('');
        }

        function renderPagination() {
            const pagination = document.getElementById('pagination');
            const totalPages = Math.ceil(filteredProducts.length / itemsPerPage);

            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = '';
            html += '<button onclick="changePage(' + (currentPage - 1) + ')"' + (currentPage === 1 ? ' class="pagination buttonDisabled"' : '') + '>« Prev</button>';

            const maxPagesToShow = 5;
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, startPage + maxPagesToShow - 1);
            
            if (endPage - startPage < maxPagesToShow - 1) {
                startPage = Math.max(1, endPage - maxPagesToShow + 1);
            }

            for (let i = startPage; i <= endPage; i++) {
                html += '<button onclick="changePage(' + i + ')" class="' + (currentPage === i ? 'active' : '') + '">' + i + '</button>';
            }

            html += '<button onclick="changePage(' + (currentPage + 1) + ')"' + (currentPage === totalPages ? ' class="pagination buttonDisabled"' : '') + '>Next »</button>';
            pagination.innerHTML = html;
        }

        function changePage(page) {
            currentPage = page;
            renderProducts();
            renderPagination();
        }

        function searchProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            filteredProducts = query === '' ? products : products.filter(p => p.nama.toLowerCase().includes(query));
            currentPage = 1;
            renderProducts();
            renderPagination();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatRupiah(nilai) {
            const num = parseFloat(nilai.replace(/\./g, '').replace(',', '.'));
            if (isNaN(num)) return nilai;
            return 'Rp ' + num.toLocaleString('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchProducts();
        });
    </script>
</body>
</html>
