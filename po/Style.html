<style>
*{box-sizing:border-box}body{margin:0;padding:8px;font-family:Arial,sans-serif;background:#e9f7ff;color:#111}
.app{max-width:680px;margin:auto;background:#4aaee5;border:6px solid #fff;border-radius:24px;padding:10px;min-height:100vh;box-shadow:0 5px 18px #999}
.hero{background:#55b2e8;border-radius:22px;text-align:center;padding:18px 8px;box-shadow:0 4px 10px #777;margin-bottom:10px}
.hero h1{margin:0 0 8px;font-size:clamp(28px,7vw,43px);letter-spacing:1px}.hero div{font-size:22px;font-weight:600}
.card{background:#fff;border-radius:25px;padding:10px 12px;margin-bottom:12px;box-shadow:0 4px 10px #777}
.row{display:grid;grid-template-columns:245px 1fr;align-items:center;gap:10px;min-height:62px}
.row label{font-size:17px}input{width:100%;border:0;border-bottom:2px solid #d85b91;outline:0;padding:10px 3px;font-size:16px;background:transparent}
.date{grid-template-columns:135px 120px 1fr}.date button{background:#277b78;color:#fff;border:0;border-radius:6px;padding:13px 8px;font-size:15px}
h2{font-size:21px;margin:17px 0 9px}.center{text-align:center;padding:7px}.btn{border:0;border-radius:6px;padding:15px 25px;font-weight:bold;cursor:pointer;box-shadow:0 2px 5px #888}
.blue{background:#0d4de8;color:#fff}.green{background:#12e518}.yellow{background:#dce923}.actions{display:flex;justify-content:center;gap:10px;margin:8px 0 12px}.items{background:#f7f7f7;min-height:42px;max-height:250px;overflow:auto;margin:5px 0;padding:7px}.empty{text-align:center;color:#777;padding:12px}
.item{display:flex;justify-content:space-between;gap:10px;padding:11px 8px;background:#fff;border-bottom:1px solid #ddd}.itemName{font-weight:bold}.remove{border:0;background:#e53935;color:#fff;border-radius:5px;padding:6px 9px}
.panel{background:#607d8b;padding:10px;margin-bottom:12px}.panelHead{display:flex;justify-content:space-between;align-items:center}.panel h2{color:#fff}.panelHead button{border:0;border-radius:6px;padding:8px 10px}
.customer{display:block;width:100%;border:0;border-bottom:1px solid #263238;background:transparent;color:#fff;text-align:left;padding:20px 10px;font-size:18px;cursor:pointer}
.detail{background:#fff;border-radius:10px;padding:15px;line-height:1.6}.barang{margin:6px 0 0 20px}.status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(92%,500px);padding:13px;border-radius:10px;color:#fff;text-align:center;z-index:10}.ok{background:#16803b}.err{background:#c62828}.hidden{display:none}
@media(max-width:560px){.app{border-width:4px;padding:7px}.row,.date{grid-template-columns:1fr;gap:2px}.date button{width:max-content}.actions{flex-wrap:wrap}.btn{min-width:125px}}
</style>
